version: '3.9'

services:
  backend:
    image: eco_backend:latest
    container_name: eco_backend
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - eco_net
    restart: unless-stopped

  frontend:
    image: eco_frontend:latest
    container_name: eco_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - eco_net
    restart: unless-stopped

  worker:
    image: eco_worker:latest
    container_name: eco_worker
    env_file:
      - .env.production
    depends_on:
      - rabbitmq
    networks:
      - eco_net
    restart: unless-stopped

  ml:
    image: eco_ml:latest
    container_name: eco_ml
    env_file:
      - .env.production
    depends_on:
      - rabbitmq
    networks:
      - eco_net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: eco_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eco_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eco_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - eco_net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eco_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - eco_net
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-57Z
    container_name: eco_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - eco_net
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: eco_nginx
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - eco_net
    restart: unless-stopped

networks:
  eco_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
