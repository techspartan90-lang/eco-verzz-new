version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: eco_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - eco_net

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: eco_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - eco_net

  worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    container_name: eco_worker
    env_file:
      - .env
    depends_on:
      - backend
      - rabbitmq
    networks:
      - eco_net

  ml:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ml
    container_name: eco_ml
    env_file:
      - .env
    depends_on:
      - backend
      - rabbitmq
    networks:
      - eco_net

  postgres:
    image: postgres:15-alpine
    container_name: eco_postgres
    environment:
      POSTGRES_USER: eco_user
      POSTGRES_PASSWORD: eco_pass
      POSTGRES_DB: eco_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - eco_net

  redis:
    image: redis:7-alpine
    container_name: eco_redis
    ports:
      - "6379:6379"
    networks:
      - eco_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eco_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: eco_user
      RABBITMQ_DEFAULT_PASS: eco_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - eco_net

  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-57Z
    container_name: eco_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - eco_net

  prometheus:
    image: prom/prometheus:latest
    container_name: eco_prometheus
    volumes:
      - ./deployment/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - eco_net

  grafana:
    image: grafana/grafana:latest
    container_name: eco_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - eco_net

  loki:
    image: grafana/loki:2.9.1
    container_name: eco_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deployment/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - eco_net

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: eco_otel
    command: ["--config", "/etc/otel-collector-config.yml"]
    volumes:
      - ./deployment/monitoring/otel/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
    networks:
      - eco_net

networks:
  eco_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
