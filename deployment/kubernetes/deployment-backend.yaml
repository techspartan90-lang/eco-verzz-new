apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoverzz-backend
  namespace: ecoverzz-prod
  labels:
    app: ecoverzz
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ecoverzz
      tier: backend
  template:
    metadata:
      labels:
        app: ecoverzz
        tier: backend
    spec:
      containers:
        - name: backend
          image: eco_backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ecoverzz-config
            - secretRef:
                name: ecoverzz-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
      imagePullSecrets: []
