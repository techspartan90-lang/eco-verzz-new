components:
  schemas:
    CategoryEnum:
      enum:
      - PLASTIC
      - PAPER
      - METAL
      - GLASS
      - ORGANIC
      - E_WASTE
      - OTHER
      type: string
      description: |-
        * `PLASTIC` - Plastic
        * `PAPER` - Paper
        * `METAL` - Metal
        * `GLASS` - Glass
        * `ORGANIC` - Organic
        * `E_WASTE` - E-Waste
        * `OTHER` - Other
    CompleteCleanup:
      type: object
      properties:
        after_image:
          type: string
          format: uri
        notes:
          type: string
      required:
      - after_image
    EmailVerification:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    Login:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Logout:
      type: object
      properties:
        refresh:
          type: string
          description: The refresh token to blacklist
      required:
      - refresh
    MunicipalityAssignment:
      type: object
      properties:
        municipality_id:
          type: integer
        notes:
          type: string
      required:
      - municipality_id
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - new_password
      - token
      - uid
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PatchedProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          maxLength: 255
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        reward_points:
          type: integer
          readOnly: true
        carbon_score:
          type: number
          format: double
          readOnly: true
        achievements:
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
    PatchedWasteReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        user_username:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        location:
          type: string
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        image:
          type: string
          format: uri
          nullable: true
        before_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        after_image:
          type: string
          format: uri
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        assigned_municipality:
          type: integer
          readOnly: true
          nullable: true
        assigned_municipality_username:
          type: string
          readOnly: true
        assigned_volunteer:
          type: integer
          readOnly: true
          nullable: true
        assigned_volunteer_username:
          type: string
          readOnly: true
        ai_metadata:
          readOnly: true
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/WasteReportTimeline'
          readOnly: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/WasteReportComment'
          readOnly: true
        rating:
          allOf:
          - $ref: '#/components/schemas/WasteReportRating'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      type: string
      description: |-
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `CRITICAL` - Critical
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          maxLength: 255
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        profile_image:
          type: string
          format: uri
          nullable: true
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        reward_points:
          type: integer
          readOnly: true
        carbon_score:
          type: number
          format: double
          readOnly: true
        achievements:
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
      required:
      - achievements
      - carbon_score
      - email
      - id
      - is_verified
      - reward_points
      - role
      - username
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 8
        full_name:
          type: string
          maxLength: 255
        phone:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
      required:
      - password
      - username
    RoleEnum:
      enum:
      - ADMIN
      - MUNICIPALITY
      - CITIZEN
      - NGO
      - RESTAURANT
      - VOLUNTEER
      - RECYCLER
      - VENDOR
      type: string
      description: |-
        * `ADMIN` - Admin
        * `MUNICIPALITY` - Municipality
        * `CITIZEN` - Citizen
        * `NGO` - NGO
        * `RESTAURANT` - Restaurant
        * `VOLUNTEER` - Volunteer
        * `RECYCLER` - Recycler
        * `VENDOR` - Vendor
    StatusEnum:
      enum:
      - PENDING
      - ASSIGNED
      - COLLECTED
      - COMPLETED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ASSIGNED` - Assigned
        * `COLLECTED` - Collected
        * `COMPLETED` - Completed
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    VolunteerAssignment:
      type: object
      properties:
        volunteer_id:
          type: integer
        notes:
          type: string
      required:
      - volunteer_id
    WasteReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        user_username:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        location:
          type: string
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        image:
          type: string
          format: uri
          nullable: true
        before_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        after_image:
          type: string
          format: uri
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        assigned_municipality:
          type: integer
          readOnly: true
          nullable: true
        assigned_municipality_username:
          type: string
          readOnly: true
        assigned_volunteer:
          type: integer
          readOnly: true
          nullable: true
        assigned_volunteer_username:
          type: string
          readOnly: true
        ai_metadata:
          readOnly: true
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/WasteReportTimeline'
          readOnly: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/WasteReportComment'
          readOnly: true
        rating:
          allOf:
          - $ref: '#/components/schemas/WasteReportRating'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_metadata
      - assigned_municipality
      - assigned_municipality_username
      - assigned_volunteer
      - assigned_volunteer_username
      - before_image
      - category
      - comments
      - created_at
      - description
      - id
      - latitude
      - location
      - longitude
      - rating
      - status
      - timeline
      - title
      - updated_at
      - user
      - user_username
    WasteReportComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - user
      - username
    WasteReportRating:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        citizen:
          type: integer
          readOnly: true
        citizen_username:
          type: string
          readOnly: true
        rating:
          type: integer
        feedback:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - citizen
      - citizen_username
      - created_at
      - id
      - rating
    WasteReportTimeline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
