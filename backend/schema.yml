          readOnly: true
          nullable: true
        changed_by_username:
          type: string
          readOnly: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_by
      - changed_by_username
      - created_at
      - id
      - status
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
