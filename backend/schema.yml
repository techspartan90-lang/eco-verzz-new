    delete:
      operationId: waste_reports_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this waste report.
        required: true
      tags:
      - waste
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
