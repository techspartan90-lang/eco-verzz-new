name: eco_verzz_mobile
description: "EcoVerzz AI - Production Cross-Platform Mobile Application for Smart City Waste Management, AI Classification, IoT GIS, and Blockchain Rewards."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Networking & HTTP
  dio: ^5.4.1

  # Local Storage & Encryption
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI Design System & Utilities
  google_fonts: ^6.2.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
